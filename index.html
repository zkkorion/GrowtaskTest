  <header class="header">
    <div class="header__inner">
      <a class="logo" href="#/cart">
        <div class="logo__text">Сайт сделан в студии</div>
        <div class="logo__name">гротеск</div>
      </a>
      <a class="cart-link" href="#/cart" aria-label="Корзина">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M6 6h13l-1.5 9a2 2 0 01-2 1.5H9.5a2 2 0 01-2-1.5L6 6z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

          <circle cx="16" cy="20" r="1.5" fill="currentColor"/>
        </svg>
        <span class="cart-link__badge js-cart-badge" >0</span>
      </a>
    </div>
  </header>

  <main>
    <!-- КОРЗИНА -->
    <section class="view" id="viewCart">
      <div class="page">
        <div class="pageHeader">
          <nav class="breadcrumbs" aria-label="Хлебные крошки">
            <ol class="breadcrumbs__list">
              <li class="breadcrumbs__item breadcrumbs__main">
                <a class="breadcrumbs__link" href="#/cart">Главная</a>
              </li>
              <li class="breadcrumbs__item breadcrumbs__item--current">
                <span class="breadcrumbs__value">Корзина</span>
              </li>
            </ol>
          </nav>
          <div class="page__title">
            <div class="page__titleText">Корзина</div>
            <div class="page__titleProductCount">
              <span id="productCount">0</span> шт.
            </div>
          </div>
        </div>
        <div class="page__content">
          <div class="listAction">
            <div class="mainActionElement selectAll">
              <input class="checkbox" type="checkbox" name="selectAll" id="selectAll">
              <label for="selectAll" class="selectAllLabel">Выбрать все</label>
            </div>
            <div class="mainActionElement clearCart">
              <button class="clearCart__button" type="button">
                <svg class="icon clearCart__icon" viewBox="0 0 16 16">
                  <use href="#trash"></use>
                </svg>
                Очистить корзину
              </button>
            </div>
          </div>
          <div class="productList">

            <div class="card">
              <div class="card__imageContainer">
                <input class="checkbox selectProduct" type="checkbox" name="selectProduct" id="">
                <img src="images/no-image.jpg" class="card__image">
              </div>
              <div class="card__nameContainer">
                <div class="card__article">Article</div>
                <div class="card__name">Handwasher</div>
              </div>
              <div class="card__priceContainer">
                <div class="card__price">
                  <span class="cardCurrentPrice">00000000 &#8381;</span>
                  <span class="cardOldPrice">0000000 &#8381;</span>
                </div>

                <div class="card__amount amount">

                  <div class="amount__actions">
                    <div class="amount__buttons">
                      <button class="mainActionElement amount__button">-</button>
                      <div class="amount__count">0</div>
                      <button class="mainActionElement amount__button">+</button>
                    </div>
                    <div class="mainActionElement">
                      <button class="amount__delete">
                        <svg class="icon clearCart__icon" viewBox="0 0 16 16">
                          <use href="#trash"></use>
                        </svg>
                      </button>
                    </div>
                  </div>

                  <div class="card__value">0000000 &#8381;</div>
                </div>


              </div>
            </div>

          </div>

          <div class="page__aside">

            <div class="cart">
              <div class="cart__title">Ваша корзина:</div>
              <div class="cart__item amout">
                <div class="cart__productCount">
                  <span class="cart__productCountValue">0</span> товаров:
                </div>
                <div class="cart__totalPrice">
                  <span class="cart__totalPriceValue">0</span> &#8381;
                </div>
              </div>
              <div class="cart__item sale">
                <div class="cart__saleTitle">Скидка:</div>
                <div class="cart__saleAmount">
                  <span class="cart__saleAmountValue">0</span> &#8381;
                </div>
              </div>
              <div class="cart__item summ">
                <div class="cart__summTitle">Итого:</div>
                <div class="cart__summAmount">
                  <span class="cart__summAmountValue">0</span> &#8381;
                </div>
              </div>
              <button class="cart__checkoutButton">К оформлению <svg class="icon" viewBox="0 0 16 16"><use href="#rightArrow"></use></svg></button>
            </div>

            <div class="promocode">
              <div class="promocode__header">
                <div class="promocode__title">
                  <svg class="icon" viewBox="0 0 20 20"><use href="#accordeonIcon"></use></svg>
                  Промокод
                </div>
                <button class="promocode__accordeon"><span class="accordeonIcon">&#8250;</span></button>
              </div>
              <div class="promocode__content">
                <div class="promocode__inputField">
                  <label for="promocode" class="promocode__label">Промокод</label>
                  <input class="promocode__input" type="text" placeholder="Введите промокод" id="promocode">
                  <button class="promocode__clear" type="button">✖</button>
                </div>
                <button class="promocode__use">Применить</button>
            </div>

          </div>

        </div>
      </div>
    </section>
    <!-- end КОРЗИНА -->

    <!-- ОФОРМЛЕНИЕ ЗАКАЗА -->
    <section class="view view_checkout" id="view-checkout" hidden>

    </section>
    <!-- end ОФОРМЛЕНИЕ ЗАКАЗА -->

    <!-- УСПЕХ -->
    <section class="view view_success" id="view-success" hidden>

    </section>
